<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Crossmix Puzzle Arcade (prototype)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #wrap { position: relative; line-height: 0; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #07060b; }
    /* CRT scanlines over the chunky pixels */
    #scan { position: absolute; left: 0; top: 0; pointer-events: none;
      background-image: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,0.22) 50%); }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="320" height="224"></canvas>
    <div id="scan"></div>
  </div>
  <script src="js/gfx.js?v=0.2.6"></script>
  <script src="js/input.js?v=0.2.6"></script>
  <script src="js/audio.js?v=0.2.6"></script>
  <script src="js/track.js?v=0.2.6"></script>
  <script src="js/track-brick.js?v=0.2.6"></script>
  <script src="js/track-calm.js?v=0.2.6"></script>
  <script src="js/track-climb.js?v=0.2.6"></script>
  <script src="js/track-jewel.js?v=0.2.7"></script>
  <script src="js/track-swap.js?v=0.2.7"></script>
  <script src="js/main.js?v=0.2.6"></script>
</body>
</html>
