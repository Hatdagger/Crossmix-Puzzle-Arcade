# Makes a GitHub release with a playable zip whenever VERSION changes on main.
name: Release demo
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          V=$(tr -d ' \n' < VERSION)
          echo "V=$V" >> $GITHUB_ENV
          mkdir -p "Crossmix-$V"
          cp -r index.html js README.md docs "Crossmix-$V/"
          zip -qr "Crossmix-$V.zip" "Crossmix-$V"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$V" "Crossmix-$V.zip" --target "$GITHUB_SHA" --title "Crossmix Puzzle Arcade $V (prototype)" --notes-file docs/release-notes.md --prerelease
