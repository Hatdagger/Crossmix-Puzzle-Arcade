# Builds the Crossmix app (Tauri): a Windows .exe and a Linux AppImage.
# On main, when VERSION changes, they're added to that version's release.
# On any other branch (or by hand) they're kept as downloadable build artifacts.
name: App
on:
  push:
    paths: [VERSION, 'app/**', 'js/**', index.html, .github/workflows/app.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            kind: exe
          - os: ubuntu-22.04
            kind: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Game files, version and icons
        shell: bash
        run: |
          V=$(tr -d ' \n\r' < VERSION); echo "V=$V" >> $GITHUB_ENV
          NUM=${V#v}
          # tauri wants three numbers (0.4 -> 0.4.0)
          case "$NUM" in *.*.*) ;; *) NUM="$NUM.0";; esac
          mkdir -p app/dist && cp -r index.html js app/dist/
          sed -i "s/^version = \".*\"/version = \"$NUM\"/" app/src-tauri/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"$NUM\"/" app/src-tauri/tauri.conf.json
          cd app/src-tauri && npx --yes @tauri-apps/cli@2 icon app-icon.png
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd app/src-tauri && npx --yes @tauri-apps/cli@2 build --no-bundle
          mkdir -p ../../out && cp target/release/crossmix.exe "../../out/Crossmix-$V.exe"
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cd app/src-tauri && npx --yes @tauri-apps/cli@2 build --bundles appimage
          mkdir -p ../../out && cp target/release/bundle/appimage/*.AppImage "../../out/Crossmix-$V.AppImage"
      # Smoke test: start the real app; on its own it should become the LAN host and serve the game.
      - name: Test run (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb > /dev/null
          xvfb-run -a app/src-tauri/target/release/crossmix > app.log 2>&1 &
          sleep 12
          cat app.log
          curl -sf http://127.0.0.1:8080/ | grep -q "<canvas" && curl -sf http://127.0.0.1:8080/js/track-grab.js > /dev/null && echo "APP HOSTS AND SERVES THE GAME"
      - name: Test run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath "out/Crossmix-$env:V.exe"
          Start-Sleep -Seconds 15
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/
          if ($r.Content -notmatch '<canvas') { throw 'game page not served' }
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/js/track-grab.js | Out-Null
          Write-Output 'APP HOSTS AND SERVES THE GAME'
          Stop-Process -Name "Crossmix-$env:V" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: crossmix-${{ matrix.kind }}
          path: out/*
      - name: Add to the release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only when this push changed VERSION (a new release); never touch older releases
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qx VERSION || { echo "VERSION unchanged: no release upload"; exit 0; }
          # the Release workflow makes the release; wait for it (up to ~5 min)
          for i in $(seq 1 30); do gh release view "$V" > /dev/null 2>&1 && break; sleep 10; done
          gh release upload "$V" out/* --clobber
