# Neo Geo CD build: PC checks (CPU vs CPU on every pairing, screenshots), then the
# disc (NeoCore on Windows): BIN/CUE for real hardware / MiSTer / ODEs, CHD for MAME.
# On main the disc is also added to the release named in VERSION.
name: Neo Geo CD
on:
  push:
    paths: ['neogeo-cd/**', '.github/workflows/neogeo-cd.yml', VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pc:
    name: PC checks (strict C89, CPU vs CPU, screenshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Art
        working-directory: neogeo-cd
        run: python3 tools/make_tiles.py
      - name: Build the harness
        working-directory: neogeo-cd
        run: sh test/build_pc.sh
      - name: CPU vs CPU, every pairing (fails on a hang)
        working-directory: neogeo-cd
        run: build-pc/xm sim 1 5 5
      - name: Tour the menus and modes, render screenshots
        working-directory: neogeo-cd
        run: |
          mkdir -p shots
          build-pc/xm script test/tour.txt shots
          python3 test/render.py shots --sheet shots/00_sheet.png
      - uses: actions/upload-artifact@v4
        with:
          name: Crossmix-NGCD-screenshots
          path: neogeo-cd/shots/*.png

  disc:
    name: Disc (NeoCore ISO, BIN/CUE, CHD)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy pillow
      - name: Art
        working-directory: neogeo-cd
        run: python tools/make_tiles.py
      - name: ffmpeg (only when music/ has songs that aren't WAV)
        working-directory: neogeo-cd
        shell: powershell
        run: |
          $own = Get-ChildItem music -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.mp3','.flac','.ogg','.opus','.m4a','.aac' }
          if ($own -and -not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: Audio (your songs from music/, placeholders for the rest, sound-chip effects)
        working-directory: neogeo-cd
        run: python tools/make_audio.py
      - name: Build sprites, program, ISO and CHD
        working-directory: neogeo-cd/src
        shell: powershell
        run: |
          $bm = "..\neocore\toolchain\scripts\Builder-Manager.ps1"
          $checks = @{ "make" = "..\build\Crossmix\Crossmix.prg" }
          foreach ($rule in @("lib", "sprite", "make", "dist:iso", "dist:mame")) {
            if ($rule -eq "dist:iso") {
              New-Item -ItemType Directory -Force -Path ..\build\Crossmix\assets\cdda | Out-Null
              Copy-Item assets\cdda\*.wav ..\build\Crossmix\assets\cdda\ -Force
            }
            Write-Host "=== mak $rule ===" -ForegroundColor Cyan
            powershell -ExecutionPolicy Bypass -File $bm -ConfigFile project.xml -Rule $rule
            if ($LASTEXITCODE -ne 0) {
              Get-Content ..\build\Crossmix\gcc.log -ErrorAction SilentlyContinue
              Get-Content ..\build\Crossmix\fix.log -ErrorAction SilentlyContinue
              throw "mak $rule failed"
            }
            if ($checks[$rule] -and -not (Test-Path $checks[$rule])) {
              Get-Content ..\build\Crossmix\gcc.log -ErrorAction SilentlyContinue
              throw "mak $rule did not produce $($checks[$rule])"
            }
          }
      - name: 68000 code check (library calls per file; each mulsi3/divsi3 is slow on the 68000)
        if: always()
        continue-on-error: true
        working-directory: neogeo-cd/build
        shell: powershell
        run: |
          $g = (Resolve-Path gcc\gcc-2.95.2).Path
          $env:PATH = "$g;$g\bin;$g\m68k\bin;" + $env:PATH
          Get-ChildItem $g -Filter *objdump* -Recurse | Select-Object -First 3 | ForEach-Object { Write-Host $_.FullName }
          $od = (Get-ChildItem $g -Filter objdump.exe -Recurse | Select-Object -First 1).FullName
          foreach ($o in Get-ChildItem Crossmix -Filter *.o) {
            $txt = & $od -dr $o.FullName 2>&1 | Out-String
            $calls = [regex]::Matches($txt, "R_68K_\w+\s+(__\w+)") | ForEach-Object { $_.Groups[1].Value } | Group-Object | Sort-Object Count -Descending | ForEach-Object { "$($_.Name)=$($_.Count)" }
            $n = ([regex]::Matches($txt, "\n\s+[0-9a-f]+:")).Count
            Write-Host ("XMASM " + $o.Name + " instr=" + $n + " " + ($calls -join " "))
          }
      - name: Converter output (for checking the fix palettes)
        if: always()
        shell: powershell
        run: |
          Get-ChildItem -Recurse neogeo-cd\src\out -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Get-Content neogeo-cd\src\out\fixPals.s -ErrorAction SilentlyContinue
          Get-Content neogeo-cd\src\out\fixData.h -ErrorAction SilentlyContinue
      - name: MAME smoke test (boots the disc, attract mode, snapshots, dropped frames)
        continue-on-error: true
        working-directory: neogeo-cd/build/mame
        shell: powershell
        run: |
          $map = Get-Content ..\Crossmix\output.map
          function Addr($name) {
            $l = $map | Select-String -Pattern ("0x[0-9a-fA-F]+\s+_?" + $name + "\s*$") | Select-Object -First 1
            if ($l) { return [string]($l.Matches[0].Value -split '\s+')[0] } else { return "0" }
          }
          $env:XM_DROP_ADDR = Addr "DAT_droppedFrames"
          $env:XM_FRAME_ADDR = Addr "DAT_frameCounter"
          $env:XM_STATUS_ADDR = Addr "xm_status"
          $env:XM_PROF_ADDR = Addr "xm_prof"
          $env:XM_PSUM_ADDR = Addr "xm_psum"
          $env:XM_PN_ADDR = Addr "xm_pn"
          Write-Host "droppedFrames at $env:XM_DROP_ADDR, frameCounter at $env:XM_FRAME_ADDR, status at $env:XM_STATUS_ADDR, prof at $env:XM_PROF_ADDR"
          New-Item -ItemType Directory -Force -Path snaps | Out-Null
          $margs = "-rompath roms -hashpath hash -cfg_directory $env:TEMP -nvram_directory $env:TEMP -skip_gameinfo -video none -sound none -nothrottle -seconds_to_run 600 -snapshot_directory snaps -snapname %i -autoboot_script ..\..\test\mame_smoke.lua neocdz -cdrom roms\neocdz\Crossmix.chd"
          Write-Host "mame64.exe $margs"
          $p = Start-Process -FilePath .\mame64.exe -ArgumentList $margs -NoNewWindow -Wait -PassThru -RedirectStandardOutput mame_out.txt -RedirectStandardError mame_err.txt
          Get-Content mame_out.txt | Select-Object -Last 40
          Get-Content mame_err.txt | Select-Object -Last 20
          Get-ChildItem -Recurse snaps | Select-Object FullName, Length
          # the snapshots, readable from the log as well
          Get-ChildItem snaps -Filter *.png | Sort-Object Name | ForEach-Object { Write-Host ("XMSNAP " + $_.Name + " " + [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))) }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Crossmix-NGCD-MAME-snapshots
          path: neogeo-cd/build/mame/snaps/**
          if-no-files-found: ignore
      - name: Raw BIN/CUE (MODE1/2352 data + audio tracks)
        working-directory: neogeo-cd
        shell: bash
        run: python tools/make_bincue.py "$(ls -d dist/Crossmix/*/cd/iso | head -1)" bincue
      - name: Package
        shell: bash
        run: |
          V=$(tr -d ' \n\r' < VERSION); echo "V=$V" >> $GITHUB_ENV
          mkdir -p out
          cd neogeo-cd/bincue && 7z a -tzip "../../out/Crossmix-$V-NeoGeoCD-BINCUE.zip" . > /dev/null && cd ../..
          CHD=$(find neogeo-cd/dist -name '*.chd' | head -1)
          if [ -n "$CHD" ]; then cp "$CHD" "out/Crossmix-$V-NeoGeoCD.chd"; fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Crossmix-NeoGeoCD
          path: out/*
          if-no-files-found: error
      - name: Add to the release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release for the current VERSION (made by the Release workflow); wait for it if it's new
          for i in $(seq 1 30); do gh release view "$V" > /dev/null 2>&1 && break; sleep 10; done
          gh release view "$V" > /dev/null 2>&1 || { echo "no release $V yet"; exit 0; }
          gh release upload "$V" out/* --clobber
